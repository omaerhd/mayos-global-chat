<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link id="siteIcon" rel="icon" href="logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        #chatBox {
            background: #222;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #chatBox p {
            margin: 6px 0;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
        }

        #username {
            width: 150px;
        }

        #message {
            width: 300px;
        }

        #version {
            color:rgb(150, 150, 150)
        }

        a {
            color: rgb(0, 162, 255)
        }

        a:hover {
            color: rgb(0, 119, 255)
        }

        button {
            background: #00ff80;
            color: rgb(0, 0, 0);
            cursor: pointer;
        }

        button:hover {
            background: #00a349;
        }
    </style>
</head>
<body>

<h2>the mayo chat</h2>

<div id="chatBox"></div>

<input id="message" maxlength="200" placeholder="type a message">
<button id="sendBtn">send</button>


<p id="version">v0.3.0 (<a href="https://github.com/omaerhd/mayos-global-chat" target="_blank" >latest version</a>)</p>

<audio id="notif">
  <source src="https://cdn.pixabay.com/audio/2026/05/21/audio_9bfbf47c1f.mp3" type="audio/mp3">
</audio>

<script type="module">
   const basetitle = "the mayo chat";
    document.title = basetitle;

    function getNameColor(speaker) {
        const NAME_COLORS = [
            "rgb(253, 41, 67)",
            "rgb(1, 162, 255)",
            "rgb(2, 184, 87)",
            "rgb(180, 128, 255)",
            "rgb(218, 133, 65)",
            "rgb(245, 205, 48)",
            "rgb(232, 186, 200)",
            "rgb(215, 197, 154)"
        ];

        function getNameValue(pName) {
            let value = 0;
            for (let index = 0; index < pName.length; index++) {
                let cValue = pName.charCodeAt(index);
                let reverseIndex = pName.length - index;
                if (pName.length % 2 === 1) {
                    reverseIndex -= 1;
                }
                if (reverseIndex % 4 >= 2) {
                    cValue = -cValue;
                }
                value += cValue;
            }
            return value;
        }

        function computeNameColor(pName) {
            return NAME_COLORS[(getNameValue(pName) % NAME_COLORS.length)];
        }

        return computeNameColor(speaker);
    }

    let username = prompt("type ur username (20 character limit)");
    if (!username) username = "nameless bum";

    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp,
        query,
        orderBy,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // storage import
    import {
        getStorage,
        ref,
        uploadBytes,
        getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBapAMh6dBFg0Jfovv_7-YUcYpOwq7y3v8",
        authDomain: "the-mayo-chat.firebaseapp.com",
        projectId: "the-mayo-chat",
        storageBucket: "the-mayo-chat.firebasestorage.app",
        messagingSenderId: "489578381536",
        appId: "1:489578381536:web:ac8946e18445db2a635085"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const sound = document.getElementById("notif");
    const chatBox = document.getElementById("chatBox");
    const messageBox = document.getElementById("message");

    let notifs = 0;

    function ping() {
        sound.currentTime = 0;
        sound.play();
    }


    // Real-time listener
    const q = query(collection(db, "messages"), orderBy("timestamp"));
    onSnapshot(q, (snapshot) => {
        chatBox.innerHTML = "";

        snapshot.forEach(doc => {
            const data = doc.data();
            const p = document.createElement("p");

            if (
                /\.(jpeg|jpg|png|gif|webp)(\?.*)?$/i.test(data.text) ||
                data.text.includes("firebasestorage")
            ) {
                p.innerHTML = `
                    <strong style="color:${getNameColor(data.user)}">${data.user}:</strong><br>
                    <img src="${data.text}" style="max-width:600px; border-radius:8px;">
                `;
            } else {
                p.innerHTML = `
                    <strong style="color:${getNameColor(data.user)}">${data.user}:</strong> ${data.text}
                `;
            }

            chatBox.appendChild(p);
        });

        //chatBox.scrollTop = chatBox.scrollHeight; (an iq too michael)
        if ((chatBox.scrollHeight - chatBox.scrollTop) < 750) {
            chatBox.scrollTop = chatBox.scrollHeight; //auto-scroll if near the bottom
        }

        if (document.hidden) {
			ping(); // plays the notification if the tab is closed 
			notifs += 1
			document.title = basetitle+" ("+notifs+")"
		};
    });

    async function sendMessage(text, user) {
        if (!text.trim()) return;

        await addDoc(collection(db, "messages"), {
            text,
            user,
            timestamp: serverTimestamp()
        });
    }

    let lastMessageTime = 0;
    let cooldown = 500;

    function sleep(ms) {return new Promise(resolve => setTimeout(resolve, ms));}

    async function extendCooldown() {
        cooldown = 5000;
        await sleep(10000);
        cooldown = 500;
    }

    async function userSend() {
        if (messageBox.value === "") return;

        const now = Date.now();

        if (now - lastMessageTime < cooldown) {
            alert("YO STFU");
            extendCooldown();
            return;
        }

        lastMessageTime = now;

        const text = document.getElementById("message").value;
        sendMessage(text, username);
        document.getElementById("message").value = "";
    }

    document.getElementById("sendBtn").onclick = userSend;

    document.addEventListener("keydown", (event) => {
        if (event.key === "Enter") userSend();
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            notifs = 0;
            document.title = basetitle;
        }
    });

</script>

</body>
</html>
